name: Test on Implementation Complete

on:
  workflow_dispatch:
    inputs:
      implementation_type:
        description: 'Tipo de implementação (feature, bugfix, refactor)'
        required: true
        default: 'feature'
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache_key: ${{ steps.cache.outputs.cache_key }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache dependencies
        id: cache
        run: echo "cache_key=${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}" >> $GITHUB_OUTPUT

  backend-tests:
    needs: setup
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: boleia_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd server && npm ci

      - name: Run backend tests
        run: |
          cd server
          npm test -- --coverage --ci
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: boleia_test
          DB_USER: test
          DB_PASSWORD: test
          JWT_SECRET: test_jwt_secret

      - name: Upload backend results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: server/test-results/

  frontend-tests:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --coverage --run

      - name: Upload frontend results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: test-results/

  integration-tests:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-lault

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: boleia_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci
          cd server && npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: boleia_test
          DB_USER: test
          DB_PASSWORD: test

  e2e-tests:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/

  validate:
    needs: [backend-tests, frontend-tests, integration-tests, e2e-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "✅ Todos testes completados"
          # Trigger validation webhook
          curl -X POST "${{ secrets.WEBHOOK_URL }}/validate" || true
